<!DOCTYPE html>
<html>
<head>
    <title>Backend Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ddd; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Backend Connection Diagnostic Tool</h1>
    <button onclick="testBackend()">Test Backend Connection</button>
    <button onclick="testCORS()">Test CORS</button>
    <button onclick="testAuth()">Test Auth Endpoint</button>
    <div id="results"></div>

    <script>
        async function testBackend() {
            const results = document.getElementById('results');
            results.innerHTML += '<div class="test">Testing backend at http://localhost:8082/api/routes...</div>';
            
            try {
                const response = await fetch('http://localhost:8082/api/routes');
                const data = await response.json();
                results.innerHTML += `<div class="test success">✓ Backend is accessible! Status: ${response.status}<br>Response: ${JSON.stringify(data)}</div>`;
            } catch (error) {
                results.innerHTML += `<div class="test error">✗ Backend connection failed: ${error.message}<br>Make sure backend is running on port 8082</div>`;
            }
        }

        async function testCORS() {
            const results = document.getElementById('results');
            results.innerHTML += '<div class="test">Testing CORS from http://localhost:8080...</div>';
            
            try {
                const response = await fetch('http://localhost:8082/api/routes', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                results.innerHTML += `<div class="test success">✓ CORS is working! Status: ${response.status}</div>`;
            } catch (error) {
                if (error.message.includes('CORS')) {
                    results.innerHTML += `<div class="test error">✗ CORS Error: ${error.message}<br>Check CrosConfig.java allows http://localhost:8080</div>`;
                } else {
                    results.innerHTML += `<div class="test error">✗ Error: ${error.message}</div>`;
                }
            }
        }

        async function testAuth() {
            const results = document.getElementById('results');
            results.innerHTML += '<div class="test">Testing /api/auth/login endpoint...</div>';
            
            try {
                const response = await fetch('http://localhost:8082/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'test@test.com',
                        password: 'test'
                    })
                });
                
                if (response.status === 401 || response.status === 400) {
                    results.innerHTML += `<div class="test success">✓ Auth endpoint is accessible (invalid credentials expected)</div>`;
                } else {
                    const data = await response.json();
                    results.innerHTML += `<div class="test success">✓ Auth endpoint is working! Status: ${response.status}</div>`;
                }
            } catch (error) {
                results.innerHTML += `<div class="test error">✗ Auth endpoint failed: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
