spring.application.name=SmartSafar

server.port=8082

# DATABASE CONFIG (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/city_bus_dbm
spring.datasource.username=root
spring.datasource.password=SHRIKANT@2024

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE CONFIG
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# CONNECTION POOL (HIKARI)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# SPRING SECURITY (JWT)
jwt.secret=cityBusSecretKey123456789
jwt.expiration=86400000

# SWAGGER / OPENAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# LOGGING
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# CORS (FRONTEND CONNECTION)
frontend.url=http://localhost:8080

# FILE / QR CONFIG (OPTIONAL)
qr.code.image.format=PNG
qr.code.image.width=250
qr.code.image.height=250

# ERROR HANDLING
server.error.include-message=always
server.error.include-binding-errors=always
